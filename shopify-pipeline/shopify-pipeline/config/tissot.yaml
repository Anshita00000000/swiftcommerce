# ============================================================
# TISSOT — BRAND CONFIG (config/tissot.yaml)
# ============================================================

brand: tissot
display_name: "Tissot"
base_url: "https://www.tissotwatches.com/en-us"

url_collection:
  # Pass 1: Master List
  primary_url: "https://www.tissotwatches.com/en-us/collection.html"
  primary_pagination:
    type: url_param
    param_template: "?page={}"
    max_pages: 20

  # Pass 2: Gender Identification
  gender_urls:
    - url: "https://www.tissotwatches.com/en-us/men.html"
      gender: "Men"
      pagination:
        type: url_param
        param_template: "?page={}"
        max_pages: 15
    - url: "https://www.tissotwatches.com/en-us/women.html"
      gender: "Women"
      pagination:
        type: url_param
        param_template: "?page={}"
        max_pages: 10

  product_link_selector: "a.product-tile"
  
  # Extracts SKU from listing page data-pid attribute
  code_extraction:
    source: "attribute"
    attribute: "data-pid"
    normalize: "uppercase"

driver:
  first_load_wait: 15
  page_load_wait: 6

anti_bot:
  random_delay_min: 3
  random_delay_max: 7
  slow_scroll: true
  scroll_pause: 0.5

# Opens Tissot accordions before scraping
pre_scrape_actions:
  - type: js_click_all
    selector: "button.ti-pdp-collapsible-link.collapsed"
    wait_after: 1.5

selectors:
  title: ["h1.product-name"]
  sku: ["p.product-reference", "[data-sku]"]
  price: ["span.ti-price-sales"]
  description: ["#collapseOne p.ti-pdp-details-content"]
  features: ["ul.bullet-list li"]

spec_extraction:
  type: aria_label
  row_selector: ".ti-pdp-details-content[aria-label]"
  label_attr: "aria-label"
  # Keys used to split Tissot's "Key Value" aria-label strings
  known_keys:
    - "SKU"
    - "Collection"
    - "Weight (g)"
    - "Length"
    - "Width"
    - "Thickness"
    - "Lugs"
    - "Water resistance"
    - "Case shape"
    - "Case Material"
    - "Crystal"
    - "Caliber"
    - "Diameter (mm)"
    - "Movement"
    - "Functions"
    - "Dial color"
    - "Strap color"

spec_table:
  header: "Item Specification"
  rows:
    - { label: "Brand", type: static, value: "Tissot" }
    - { label: "Reference", type: spec, spec_key: "SKU" }
    - { label: "Case Material", type: spec, spec_key: "Case Material" }
    - { label: "Movement", type: spec, spec_key: "Movement" }
    - { label: "Water Resistance", type: spec, spec_key: "Water resistance" }
    - { label: "Weight (g)", type: spec, spec_key: "Weight (g)" }
    - { label: "Case Shape", type: spec, spec_key: "Case shape" }
    - { label: "Case Diameter (mm)", type: spec, spec_key: "Width" }
    - { label: "Case Thickness (mm)", type: spec, spec_key: "Thickness" }
    - { label: "Lug Width (mm)", type: spec, spec_key: "Lugs" }
    - { label: "Crystal", type: spec, spec_key: "Crystal" }
    - { label: "Energy", type: spec, spec_key: "Energy" }
    - { label: "Caliber", type: spec, spec_key: "Caliber" }
    - { label: "Movement Diameter (mm)", type: spec, spec_key: "Diameter (mm)" }
    - { label: "Battery", type: spec, spec_key: "Battery" }
    - { label: "Functions", type: spec, spec_key: "Functions" }
    - { label: "Dial Display", type: spec, spec_key: "Dial" }
    - { label: "Dial Color", type: spec, spec_key: "Dial color" }
    - { label: "Strap Color", type: spec, spec_key: "Strap color" }

image_extraction:
  method: dom_selector
  dom_selectors:
    - "img.ti-pdp-image[data-modal-img-index]"
    - ".ti-pdp-images-gallery-swiper img.ti-pdp-image"
  dom_attribute: "src"
  strip_query_params: true
  exclude_keywords: ["_shadow"]

shopify:
  vendor: "Tissot"
  product_type: "Watches"
  product_category: "Apparel & Accessories > Jewelry > Watches"
  default_tags: ["Watches", "Wristwatches", "SwiftCommerce_Tissot"]
  gender_tags:
    mens: "Men's Watches"
    womens: "Women's Watches"
    unisex: "Men's Watches, Women's Watches"