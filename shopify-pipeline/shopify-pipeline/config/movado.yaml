# ============================================================
# MOVADO — BRAND CONFIG (config/movado.yaml)
# ============================================================

brand: movado
display_name: "Movado"
base_url: "https://www.movado.com"

url_collection:

  primary_url: "https://www.movado.com/us/en/shop-watches/shop-all-watches"
  primary_pagination:
    type: load_more
    load_more_selector: "div.my-20 button[data-testid='button']"
    max_clicks: 50

  gender_urls:
    - url: "https://www.movado.com/us/en/mens-designs"
      gender: "Men"
      pagination:
        type: load_more
        load_more_selector: "div.my-20 button[data-testid='button']"
        max_clicks: 30
    - url: "https://www.movado.com/us/en/womens-designs"
      gender: "Women"
      pagination:
        type: load_more
        load_more_selector: "div.my-20 button[data-testid='button']"
        max_clicks: 30

  # Selector for product links on the listing page
  product_link_selector: "a[href*='/us/en/shop-watches/'][href$='.html']"
  
  # Extracts numeric SKU from the Affirm element on the listing card or PDP
  code_extraction:
    source: "attribute"
    attribute: "data-sku"
    normalize: "uppercase"

driver:
  first_load_wait: 15
  page_load_wait: 6

anti_bot:
  random_delay_min: 2
  random_delay_max: 5
  slow_scroll: true
  scroll_pause: 2.5

# No pre-scrape actions needed as Movado's technical details are open by default
pre_scrape_actions:
  - type: js_click_all
    selector: ".accordion-title[aria-controls='Technical Details'][aria-expanded='false']"

selectors:
  title: 
    - "h1.builder-has-component span.builder-text"
    - "h1[builder-id] span"
  sku: 
    - "[data-sku]"
  price: 
    - "span[data-testid='special-price']"
    - ".text-special-price-clr"
  description: 
    - ".pdp-description .font-fontPrimary"
    - ".description-main-wrapper .font-fontPrimary"

spec_extraction:
  type: accordion
  item_selector: "details[data-testid='accordion-item'][open] .flex-col"
  label_selector: "h5"
  value_selector: "span"

spec_table:
  header: "Item Specification"
  rows:
    - { label: "Brand", type: static, value: "Movado" }
    - { label: "Reference", type: spec, spec_key: "SKU" }
    - { label: "Dial", type: spec, spec_key: "Dial" }
    - { label: "Case Diameter", type: spec, spec_key: "Case Diameter" }
    - { label: "Case Depth", type: spec, spec_key: "Case Depth" }
    - { label: "Case Material", type: spec, spec_key: "Case Material" }
    - { label: "Crystal", type: spec, spec_key: "Crystal Fabrication" }
    - { label: "Water Resistance", type: spec, spec_key: "Water Resistance" }
    - { label: "Movement", type: spec, spec_key: "Movement" }
    - { label: "Watch Shape", type: spec, spec_key: "Watch Shape" }
    - { label: "Strap", type: spec, spec_key: "Strap" }
    - { label: "Bracelet Type", type: spec, spec_key: "Bracelet" }
    - { label: "Clasp Type", type: spec, spec_key: "Clasp Type" }

image_extraction:
  method: dom_selector
  dom_selectors:
    # Desktop gallery (stacked images)
    - ".hidden.lg\\:block img[src*='sfcc-prod.movado.com']"
    # Mobile swiper fallback
    - ".swiper-slide[data-swiper-slide-index] img[src*='sfcc-prod.movado.com'][aria-hidden='false']"
    # General SFCC CDN fallback
    - "img[src*='sfcc-prod.movado.com'][src*='/images/products/']"
  dom_attribute: "src"
  strip_query_params: true
  exclude_keywords: ["placeholder", "builder.io"]

shopify:
  vendor: "Movado"
  product_type: "Watches"
  product_category: "Apparel & Accessories > Jewelry > Watches"
  default_tags: ["Wristwatches", "Watches", "Jewelry & Watches", "SwiftCommerce_Movado"]
  gender_tags:
    mens: "Men's Watches"
    womens: "Women's Watches"
    unisex: "Men's Watches, Women's Watches"