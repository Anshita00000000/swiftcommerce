# ============================================================
# WOLF 1834 — BRAND CONFIG
# Verified against: https://www.wolf1834.com/us/roadster-single-winder-2/black
# Platform: Magento
# ============================================================

brand: wolf1834
display_name: "Wolf"
base_url: https://www.wolf1834.com

url_collection:
  type: category_scrape
  category_urls:
    - https://www.wolf1834.com/us/watch-winders.html
    - https://www.wolf1834.com/us/watch-boxes.html
    - https://www.wolf1834.com/us/jewelry-boxes

  pagination:
    type: scroll

  # Wolf has no gender collections
  gender_urls: []

  product_link_selector: "a.product-item-link"

  code_extraction:
    source: "attribute"
    selector: "form[data-product-sku]"
    attribute: "data-product-sku"
    normalize: "uppercase"

driver:
  type: undetected
  use_webdriver_manager: true
  start_maximized: true
  first_load_wait: 25
  page_load_wait: 8

anti_bot:
  random_delay_min: 5
  random_delay_max: 10
  slow_scroll: false

pre_scrape_actions:
  - type: js_click_all
    selector: ".product-details__title"

selectors:
  title:
    - "h1.page-title span.base"
    - ".page-title span"
  price:
    - ".product-info-price .price"
    - ".price-box .price"
    - ".price-wrapper .price"
  sku:
    - "#product-sku .value"
    - ".product.attribute.sku .value"
  description:
    - ".product.attribute.description .value"
    - ".product.attribute.overview .value"
  features:
    - ".product.attribute.features .value ul li"
  color:
    - ".swatch-attribute.color .swatch-attribute-selected-option"
  size:
    - "#product-sizing .value"

image_extraction:
  method: both
  dom_selectors:
    - "a.media-gallery--image"
    - "a[data-pswp-width]"
    - ".gallery-placeholder img"
  dom_attribute: href
  magento_json: true
  exclude_keywords:
    - thumb
    - swatch
    - small
    - 60x60
    - 150x150

image_download:
  use_session_cookies: false
  referer: "https://www.wolf1834.com/"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

spec_table:
  header: "Item Specification"
  rows:
    - label: "Brand"
      type: static
      value: "Wolf 1834"
    - label: "Color"
      type: scraped
      field: color
    - label: "Size"
      type: scraped
      field: size
    - label: "Item No"
      type: scraped
      field: sku
    - label: "Description"
      type: scraped
      field: description

shopify:
  vendor: "Wolf 1834"
  product_type: "Watch Winder"
  status_on_import: draft
  default_tags:
    - wolf1834
    - watch-winder
    - luxury
  source_url_metafield: "custom.source_url"
