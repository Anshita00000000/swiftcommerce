# ============================================================
# G-SHOCK — BRAND CONFIG
# Verified against: G-SHOCK.txt (HTML snapshot provided by user)
# Platform: Adobe Experience Manager (AEM) / Casio custom CMS
# Primary listing: https://www.casio.com/us/watches/gshock.filter.K84vKnGqtE1KLS5R0youyU@ODi5JLCkttgUA/
# Women's listing: https://www.casio.com/us/watches/gshock/products/women.filter.K84vKnGqtM1LLU8tLlHTKi7JT84OLkksKS22BQA%3D/
# NOTE: No dedicated men's URL — the primary listing is all G-SHOCK; gender
#       is determined by which collection URL the product was found on.
#       Men's = primary URL (all products not in women's).
#       Women's = women filter URL.
# Product URL pattern: https://www.casio.com/us/watches/gshock/product.{model-name}/
#   e.g. /us/watches/gshock/product.GA-700UC-3A/
# ============================================================

brand: gshock
display_name: "G-SHOCK"
base_url: https://www.casio.com

url_collection:
  type: category_scrape
  category_urls:
    - url: "https://www.casio.com/us/watches/gshock.filter.K84vKnGqtE1KLS5R0youyU@ODi5JLCkttgUA/"
      gender: mens
    - url: "https://www.casio.com/us/watches/gshock/products/women.filter.K84vKnGqtM1LLU8tLlHTKi7JT84OLkksKS22BQA%3D/"
      gender: womens

  pagination:
    # Confirmed: "Pagination: Infinite Scroll"
    type: infinite_scroll
    scroll_pause: 3.0
    max_scroll_attempts: 40        # G-SHOCK has a large catalog (~400+ models)
    stable_count_threshold: 2

  # Confirmed from listing card HTML:
  #   <a href="/us/watches/gshock/product.GWG-B1000TLC-1A/">
  # Note: relative URL, base_url must be prepended
  product_link_selector: ".cmp-product_panel a[href*='/us/watches/gshock/product.']"
  link_attribute: href
  link_is_relative: true           # Prepend https://www.casio.com

  # SKU available directly on listing card — two formats:
  #   data-sku="GWG-B1000TLC-1ACR"  ← includes 'CR' US region suffix
  #   data-product-name="GWG-B1000TLC-1A"  ← clean model name (no CR), used in URLs
  # Use data-product-name as canonical SKU (no suffix, matches product URL)
  listing_sku_selector: ".cmp-product_panel[data-product-name]"
  listing_sku_attribute: data-product-name

driver:
  type: undetected
  use_webdriver_manager: true
  start_maximized: true
  first_load_wait: 8
  page_load_wait: 4

anti_bot:
  random_delay_min: 2
  random_delay_max: 5
  slow_scroll: true
  scroll_pause: 2.5

# ── Listing page availability ─────────────────────────────────────────────────
# TWO button states confirmed on listing cards:
#
#   AVAILABLE:
#     <div class="cmp-product_panel__btn-addcart">
#       <a href="javascript:void(0)" aria-label="BUY NOW G-SHOCK GWGB1000TLC1A">BUY NOW</a>
#     </div>
#
#   OUT OF STOCK ("Notify Me" product):
#     <div class="cmp-product_panel__btn-addcart cmp-product_panel__btn-addcart--noicon" style="display: block;">
#       <a href="javascript:void(0)" aria-label="NOTIFY ME G-SHOCK GBD800-1B">NOTIFY ME</a>
#     </div>
#
# Strategy: check the aria-label text of the buy button on the listing card.
# "BUY NOW" = available, "NOTIFY ME" = out of stock.
# The --noicon modifier class is also a reliable OOS indicator.

listing_availability:
  present_on_listing: true
  selector: ".cmp-product_panel__btn-addcart a"
  available_text: "BUY NOW"
  unavailable_text: "NOTIFY ME"
  # Alternative: check for the --noicon modifier class as a secondary signal
  unavailable_class: "cmp-product_panel__btn-addcart--noicon"

# ── Product page availability ─────────────────────────────────────────────────
# PDP buy button confirmed:
#   <div class="p-product__btn-addcart">
#     <a href="javascript:void(0)">BUY NOW</a>
#   </div>
# OOS state (inferred from listing NOTIFY ME pattern):
#   The PDP likely shows a "NOTIFY ME" or "WHERE TO BUY" button when OOS.
#   "WHERE TO BUY" is a secondary always-present button (links to store finder),
#   NOT an availability indicator — do not use it for availability check.
product_availability:
  selector: ".p-product__btn-addcart a"
  available_text: "BUY NOW"
  unavailable_text: "NOTIFY ME"
  # Fallback: if .p-product__btn-addcart is absent but .p-product__btn-addcart--notify exists
  fallback_unavailable_selector: ".p-product__btn-addcart--notify"

# ── Pre-scrape actions ────────────────────────────────────────────────────────
# Spec accordions are ALL OPEN by default (aria-expanded="true", is-open class on h3)
# No click needed to reveal spec content.
pre_scrape_actions: []

selectors:
  # Confirmed: <h1 class="cmp-hdg__ttl">GA700UC-3A</h1>
  # Inside .p-product_detail-hdg-lv1 > .cmp-hdg > h1
  # Note: the h1 shows the model code WITHOUT dashes (GA700UC-3A), not a marketing name.
  # This is G-SHOCK's display convention — keep as-is, do not normalise dashes.
  title:
    - ".p-product_detail-hdg-lv1 h1.cmp-hdg__ttl"
    - ".p-product_detail-hdg-lv1 h1"

  # Confirmed: price is a text node directly inside .p-product_detail-price after the label div
  #   <div class="p-product_detail-price" data-price_api="done" style="visibility: visible;">
  #     <div class="p-product_detail-price-label"> </div>
  #     $110.00
  #   </div>
  # Select the wrapper and strip the label child's text
  price:
    - ".p-product_detail-price"
  price_cleanup:
    strip_child_text: ".p-product_detail-price-label"   # remove label div text before extracting

  # SKU:
  #   Listing card: data-product-name="GA-700UC-3A" (clean, no CR suffix)
  #   PDP: data-sku="GA-700UC-3ACR" on the favourite button — strip 'CR' suffix
  #   Also in URL: /product.GA-700UC-3A/ — most reliable fallback
  sku:
    - "[data-product-name]"         # On PDP hero: data-product-name="GA-700UC-3A"
    - ".p-product__btn-fav[data-product-name]"
  sku_from_data_sku:
    selector: "[data-sku]"
    strip_suffix: "CR"              # Remove trailing 'CR' regional code
  sku_from_url:
    enabled: true
    pattern: "/product\\.([^/]+)/$"  # Extract model from /product.GA-700UC-3A/

  # G-SHOCK does not show a conventional prose description on the PDP —
  # the product page is spec/features focused. No description block found in HTML.
  # Leave empty; description will be blank or pulled from spec features.
  description: []

  # Series info from sub-title (e.g. "ANALOG-DIGITAL", "GA-700 SERIES")
  # Useful as supplemental context but not a required Shopify field
  series:
    - ".p-product_detail-subttl a"
    - ".p-product_detail-subttl"

  color: []     # No colour selector on PDP; colour is part of model code
  features: []  # Features are in the Watch Features spec accordion

# ── Spec accordions ───────────────────────────────────────────────────────────
# 3 accordions confirmed, ALL OPEN BY DEFAULT (is-open class, aria-expanded="true"):
#   1. Basic Information
#   2. Exterior
#   3. Watch Features
#
# Structure (identical across all three):
#   .p-product_detail-spec-accordion__item
#     h3.p-product_detail-spec-accordion__header  ← accordion title in data-item-title
#     .p-product_detail-spec-accordion__panel
#       ul.p-product_detail-spec-accordion__panel-inner
#         li.p-product_detail-spec-accordion__panel-item
#           .p-product_detail-spec-accordion__panel-item-ttl > h4   ← label
#           .p-product_detail-spec-accordion__panel-item-cont       ← value(s)
#
# NOTE: Some items have MULTIPLE -cont divs for the same h4 (e.g. Alarm/hourly
# time signal has two -cont divs). Join all -cont values with newline.
# NOTE: "Other features" has 3 -cont divs — same join strategy.
#
# COMPLETE SPEC FIELDS CONFIRMED FROM HTML:
#
# Basic Information:
#   Case size (L× W× H)   → 57.5 × 53.4 × 18.4 mm
#   Weight                → 69 g
#   Case and bezel material → Resin
#   Band                  → Resin Band
#   Construction          → Shock Resistant
#   Water resistance      → 200-meter water resistance
#   Power supply and battery life → Approx. battery life: 5 years on CR2016
#
# Exterior:
#   Glass                 → Mineral Glass
#
# Watch Features:
#   World time, Stopwatch, Timer, Alarm/hourly time signal,
#   Light, Light color, Calendar, Mute feature, Accuracy, Other features

spec_accordion:
  container_selector: ".p-product_detail-spec-accordion"
  item_selector: ".p-product_detail-spec-accordion__panel-item"
  label_selector: ".p-product_detail-spec-accordion__panel-item-ttl h4"
  value_selector: ".p-product_detail-spec-accordion__panel-item-cont"
  multi_value_join: "\n"           # Multiple -cont divs per item → join with newline

  # Quick-read cache: spec data is also encoded in the accordion header's
  # data-sub-items-info attribute as semicolon-separated key:value pairs.
  # This can be used as a fast extraction fallback without iterating all li items.
  fast_extract:
    enabled: true
    selector: ".p-product_detail-spec-accordion__header"
    attribute: "data-sub-items-info"
    pair_separator: ";"
    kv_separator: ":"

# ── Spec table (output format) ────────────────────────────────────────────────
spec_table:
  header: "Item Specification"
  rows:
    - label: "Brand"
      type: static
      value: "G-SHOCK"
    - label: "SKU"
      type: scraped
      field: sku
    - label: "Case Size (L × W × H)"
      type: spec_accordion
      spec_key: "Case size (L× W× H)"
    - label: "Weight"
      type: spec_accordion
      spec_key: "Weight"
    - label: "Case & Bezel Material"
      type: spec_accordion
      spec_key: "Case and bezel material"
    - label: "Band"
      type: spec_accordion
      spec_key: "Band"
    - label: "Construction"
      type: spec_accordion
      spec_key: "Construction"
    - label: "Water Resistance"
      type: spec_accordion
      spec_key: "Water resistance"
    - label: "Glass"
      type: spec_accordion
      spec_key: "Glass"
    - label: "Power / Battery Life"
      type: spec_accordion
      spec_key: "Power supply and battery life"
    - label: "Accuracy"
      type: spec_accordion
      spec_key: "Accuracy"
    - label: "World Time"
      type: spec_accordion
      spec_key: "World time"
    - label: "Stopwatch"
      type: spec_accordion
      spec_key: "Stopwatch"
    - label: "Timer"
      type: spec_accordion
      spec_key: "Timer"
    - label: "Alarm"
      type: spec_accordion
      spec_key: "Alarm/hourly time signal"
    - label: "Backlight"
      type: spec_accordion
      spec_key: "Light"
    - label: "Calendar"
      type: spec_accordion
      spec_key: "Calendar"
    - label: "Other Features"
      type: spec_accordion
      spec_key: "Other features"

# ── Image extraction ──────────────────────────────────────────────────────────
# Confirmed PDP image structure:
#   .p-product_detail-visual > ul > li > .p-product_detail-visual__itm-img
#     button > picture
#       source srcset="/content/dam/casio/.../GA-700UC-3A_01.png.transform/main-visual-pc/image.png"
#       img src="...main-visual-pc/image.png"
#            data-original-path="...GA-700UC-3A_01.png"  ← full-res, no transform
#
# The data-original-path attribute contains the raw PNG path without any
# image transform — this is the highest quality source.
# URL: https://www.casio.com + data-original-path
#
# Listing card image (lower res, different transform):
#   img src="/content/dam/casio/.../assets/GWG-B1000TLC-1A.png.transform/product-panel/image.png"
# Do NOT use listing card images — too small, and have a different transform suffix.
#
# For products with multiple colour variants, additional slides may appear in the
# carousel (.p-product_detail-carousel) but these are typically just the product
# listing thumbnails, not PDP gallery images. Use only the main visual section.

image_extraction:
  method: dom
  dom_selectors:
    # Best: full-res original path via data-original-path attribute
    - ".p-product_detail-visual img[data-original-path]"
    # Fallback: main-visual-pc transform (still high res desktop image)
    - ".p-product_detail-visual picture source[media*='768px']"
    - ".p-product_detail-visual img[src*='/content/dam/casio']"
  # For data-original-path selector, use this attribute not src
  dom_attribute: data-original-path
  dom_attribute_fallback: src
  base_url_prepend: "https://www.casio.com"   # All Casio image paths are root-relative
  url_cleanup:
    strip_query_params: false       # Casio DAM URLs have no query params to strip
    strip_transform_suffix: true    # Strip .transform/*/image.png for raw asset
    transform_pattern: "\\.transform/[^/]+/image\\.png$"

image_download:
  use_session_cookies: false
  referer: "https://www.casio.com/"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

# ── Shopify export ────────────────────────────────────────────────────────────
# Source: confirmed from end of G-SHOCK.txt
#   Vendor: G-SHOCK
#   Type: Watches
#   Tags: Wristwatches, Watches, Jewelry & Watches, SwiftCommerce_Gshock
#         + Women's Watches (if women), Men's Watches (if men), both if unisex
#   Product Category: Apparel & Accessories > Jewelry > Watches
shopify:
  vendor: "G-SHOCK"
  product_type: "Watches"
  product_category: "Apparel & Accessories > Jewelry > Watches"
  status_on_import: draft

  default_tags:
    - "Wristwatches"
    - "Watches"
    - "Jewelry & Watches"
    - "SwiftCommerce_Gshock"

  gender_tags:
    mens: "Men's Watches"
    womens: "Women's Watches"
    unisex:
      - "Men's Watches"
      - "Women's Watches"

  source_url_metafield: "custom.source_url"

# ── Notes ─────────────────────────────────────────────────────────────────────
# 1. BOT PROTECTION: casio.com was previously blocked ("Access Denied") during
#    research. The undetected ChromeDriver + slow scroll strategy should handle
#    this, but if blocks recur, add a longer first_load_wait and increase
#    random_delay_min/max. A residential proxy may be needed as a last resort.
#
# 2. SKU FORMAT: G-SHOCK uses hyphenated model codes (GA-700UC-3A) as SKUs.
#    The listing card exposes data-sku (with 'CR' suffix) and data-product-name
#    (clean, no suffix). Always use data-product-name as the canonical SKU.
#    The .cmp-product_panel__code div shows a dashless display code (GA700UC-3A)
#    which should NOT be used as the SKU.
#
# 3. SPEC VARIABILITY: Watch Features specs vary heavily by model. Some models
#    will have fields not listed here (e.g. Bluetooth, Solar, Tide graph).
#    The scraper should collect ALL h4/cont pairs present, not just the known_fields.
#    The spec_table above only defines display rows for common fields.
#
# 4. DESCRIPTION: No prose marketing description block found in the PDP HTML.
#    The title is just the model code. Consider using the series subttl
#    (e.g. "ANALOG-DIGITAL", "GA-700 SERIES") as a short description prefix.
