# ── Image extraction ──────────────────────────────────────────────────────────
# Confirmed from HTML: product gallery uses a grid slider (.js_slides / .js_slide).
# Each slide contains an <img> with src and srcset attributes.
# The src URLs have image manipulation parameters appended:
#   ?im=Resize=(300,825),aspect=fill;Crop=(0,0,300,825),gravity=Center;Blur=10
# These params must be stripped to get the clean base image URL.
# Full-res URL is exposed via openModal() click handler on each image:
#   @click="openModal('https://www.rado.com/media/catalog/product/.../file.png?im=AspectCrop=(1980,1980),...')"
# Strategy: extract src from .js_slide img tags; strip ?im= query string for full-res.
#
# Confirmed example:
#   src: https://www.rado.com/media/catalog/product/c/e/centrix_r30230922_sld_web.png?im=Resize=(300,825),...
#   clean: https://www.rado.com/media/catalog/product/c/e/centrix_r30230922_sld_web.png
image_extraction:
  method: dom
  dom_selectors:
    - ".js_slides .js_slide img"
  dom_attribute: src
  magento_json: false
  url_cleanup:
    strip_query_params: true    # Strip ?im=... manipulation params to get original image
    prepend_scheme: null        # URLs are already absolute with https://

image_download:
  use_session_cookies: false
  referer: "https://www.rado.com/"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

# ── Shopify export ────────────────────────────────────────────────────────────
# Source: confirmed from end of Rado.txt
#   Vendor: Rado
#   Tags: Wristwatches, Watches, Jewelry & Watches, SwiftCommerce_Rado,
#         + Women's Watches (if women), Men's Watches (if men), both if unisex
#   Product Category: Apparel & Accessories > Jewelry > Watches
#   Type: Watches
shopify:
  vendor: "Rado"
  product_type: "Watches"
  product_category: "Apparel & Accessories > Jewelry > Watches"
  status_on_import: draft

  default_tags:
    - "Wristwatches"
    - "Watches"
    - "Jewelry & Watches"
    - "SwiftCommerce_Rado"

  # Added at runtime based on which collection URL the product was scraped from
  gender_tags:
    mens: "Men's Watches"
    womens: "Women's Watches"
    unisex:
      - "Men's Watches"
      - "Women's Watches"

  source_url_metafield: "custom.source_url"
