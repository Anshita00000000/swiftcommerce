# ============================================================
# RADO — BRAND CONFIG
# Verified against: Rado.txt (HTML snapshot provided by user)
# Platform: Adobe Commerce (Magento 2) + Hyvä frontend + Alpine.js + Algolia
# Collection page: https://www.rado.com/en_us/watches/all-watches.html
# Women's page:    https://www.rado.com/en_us/watches/all-watches/women-watches.html
# Product example: https://www.rado.com/en_us/centrix-automatic-diamonds-r30230922.html
# Total products:  ~229 (confirmed from HTML: "36 articles out of 229")
# ============================================================

brand: rado
display_name: "Rado"
base_url: https://www.rado.com

url_collection:
  type: category_scrape
  category_urls:
    # NOTE: Rado does not embed gender in a parseable data attribute on listing cards.
    # Gender must be inferred from which collection URL the product was found on.
    # Primary URL covers all watches; women's URL covers women only.
    # Men's watches = products found on primary URL but NOT on women's URL.
    # Simpler approach: scrape women's URL and tag those as womens;
    # scrape primary URL and tag remaining as mens.
    - url: https://www.rado.com/en_us/watches/all-watches.html
      gender: detect_from_url   # Default — tag as mens unless also on womens URL
    - url: https://www.rado.com/en_us/watches/all-watches/women-watches.html
      gender: womens

  pagination:
    # Confirmed from HTML: "Show more" button powered by Alpine.js / Algolia store
    # <button @click="$store.AlgoliaProductsList.loadMore()" x-show="nbProducts < nbHits">Show more</button>
    # This is a JS-driven load-more — NOT a URL param or href pagination.
    # Scraper must click the button repeatedly until it disappears (nbProducts >= nbHits).
    type: load_more_js
    load_more_selector: "button[\\@click*='loadMore']"
    # Fallback selector if Alpine binding not matchable:
    load_more_text: "Show more"
    # Counter selector to detect completion:
    # <span x-text="$store.AlgoliaProductsList.nbProducts">36</span>
    # <span x-text="$store.AlgoliaProductsList.nbHits">229</span>
    total_count_selector: "[x-text*='nbHits']"
    loaded_count_selector: "[x-text*='nbProducts']"

  # Confirmed: product cards are rendered inside Alpine.js x-for loop.
  # Hydrated anchor tag (with href) confirmed in HTML:
  # <a ... href="https://www.rado.com/en_us/centrix-automatic-diamonds-r30230922.html">
  # Selector targets the outer anchor wrapping each product card.
  product_link_selector: "a.block.w-full.h-full[href*='rado.com/en_us']"
  link_attribute: href

  # SKU available from wishlist button on listing card (rendered after Alpine hydration):
  # <button ... :data-product-sku="hit.sku" ... data-product-sku="R30230922">
  listing_sku_selector: "[data-wishlist-icon][data-product-sku]"
  listing_sku_attribute: data-product-sku

driver:
  type: undetected
  use_webdriver_manager: true
  start_maximized: true
  first_load_wait: 12        # Algolia + Alpine.js page — needs time to hydrate
  page_load_wait: 5

anti_bot:
  random_delay_min: 3
  random_delay_max: 7
  slow_scroll: true
  scroll_pause: 2.5

# ── Listing page availability ─────────────────────────────────────────────────
# No availability badge visible on collection listing cards in the HTML snapshot.
# All products shown on listing page are assumed to be available.
# Actual availability must be confirmed on the product page.
listing_availability:
  present_on_listing: false

# ── Product page availability ─────────────────────────────────────────────────
# Available:
#   <button type="submit" ... id="product-addtocart-button" data-addto="cart">
#     Add to Cart
#   </button>
# Not available: button would be absent or disabled (not confirmed in snapshot,
# but standard Magento/Hyvä pattern — treat absent button as unavailable).
product_availability:
  selector: "button#product-addtocart-button[data-addto='cart']"
  available_text: "Add to Cart"
  disabled_means: unavailable

# ── Pre-scrape actions ─────────────────────────────────────────────────────────
# Confirmed: spec accordions are collapsed by default (x-show controlled by Alpine.js).
# There are 5 spec accordions: Global features, Case, Dial, Movement, Bracelet.
# Each accordion is toggled by clicking its corresponding button:
#   <button @click="toggleAccordion(0)"> Global features </button>
#   ... (indices 0–4)
# All are collapsed on load (currentOpenAccordion defaults to 0 = Global features only).
# Strategy: click all accordion toggle buttons to open them all before scraping.
pre_scrape_actions:
  - type: click_all
    selector: "div.accordion button[type='button'][\\@click*='toggleAccordion']"
    wait_after: 1.5

selectors:
  # Confirmed:
  # <h1 class="flex flex-col md:gap-2">
  #   <span class="text-xl md:text-3xl font-helvetica-condensed tracking-widest font-normal uppercase">
  #     Centrix Automatic Diamonds
  #   </span>
  #   <span class="sr-only">R30230922</span>
  #   <span class="text-base tracking-0.04 font-helvetica-light text-radoNeutral-700">
  #     35.0 mm, Automatic, 100 g
  #   </span>
  # </h1>
  title:
    - "h1 span.font-helvetica-condensed"
    - "h1 span.tracking-widest"

  # The subtitle span (below title) contains case size, movement type, weight — informational only
  subtitle:
    - "h1 span.text-radoNeutral-700"

  # SKU: confirmed from breadcrumb and wishlist button
  # Breadcrumb: <span class="product text-secondary-dark text-base">Ref. R30230922</span>
  # Wishlist:   data-product-sku="R30230922"  (most reliable)
  # Also in h1: <span class="sr-only">R30230922</span>
  sku:
    - "h1 span.sr-only"
    - "button#add-to-wishlist"
  sku_attribute_fallback: "data-addto"  # Not used — .sr-only text content is preferred
  # Note: breadcrumb prefix "Ref. " must be stripped if breadcrumb selector is used
  sku_prefix_to_strip: "Ref. "

  # Price: confirmed
  # <span id="product-price-1999" class="price-wrapper ...">
  #   <span class="price" ...>$5,150.00</span>
  # </span>
  price:
    - "span.price-wrapper span.price"
    - "#product-price-1999 span.price"

  # Description: confirmed — prose paragraph shown below title before add-to-cart
  # <p class="text-base md:text-xl tracking-0.04 font-helvetica-light text-radoNeutral-700 line-clamp-2">
  #   Experience the harmonious blend...
  # </p>
  # Full text available in modal: <div x-data="initDescriptionModal()"> ... <p>...</p> </div>
  description:
    - "div[x-data*='initDescriptionModal'] p.font-helvetica-light"
    - "p.font-helvetica-light.text-radoNeutral-700.line-clamp-2"

  color: []
  features: []   # Rado specs are in dedicated accordions — no bullet feature list

# ── Spec accordions ────────────────────────────────────────────────────────────
# 5 spec accordion sections on the product page:
#   0: Global features   (Reference Number, Case material, Case diameter, Movement type, Weight)
#   1: Case              (Diameter, Thickness, Case material, Case color, Bezel, Crown, Caseback)
#   2: Dial              (Colour, Dial indicator, Gem-Set)
#   3: Movement          (Movement type, Caliber, Power reserve, Accuracy, Balance wheel)
#   4: Bracelet          (Bracelet material, Bracelet color, Clasp)
#
# Structure per spec item (confirmed from HTML):
#   <div class="flex flex-col gap-2">
#     <h4 class="md:text-xl tracking-0.08 font-helvetica-condensed font-normal uppercase">
#       Reference Number
#     </h4>
#     <p class="text-base tracking-0.04 font-helvetica font-light">
#       R30230922
#     </p>
#   </div>
#
# Accordion panel selector (confirmed):
#   <div x-ref="accordion-{n}" x-show="isOpenAccordion({n})" class="xl:order-1 xl:col-span-5">
#
# Heading for each section (inside the button, confirmed):
#   <span class="flex gap-2 items-center uppercase ..."> [SVG icon] Global features </span>
#
# Verified spec values (R30230922 Centrix Automatic Diamonds):
#   Global features:
#     Reference Number  : R30230922
#     Case material     : Stainless steel / PVD
#     Case diameter     : 35.0 mm
#     Movement type     : Automatic
#     Weight            : 100g
#   Case:
#     Diameter          : 35.0 mm
#     Thickness         : 11.1 mm
#     Case material     : Stainless steel / PVD
#     Case color        : light
#     Bezel             : Stainless steel / PVD, 60 Diamonds - 0.79200 Carat
#     Crown             : Crown, Stainless steel / PVD
#     Caseback          : Transparent sapphire case back, Stainless Steel
#   Dial:
#     Colour            : Brown
#     Dial indicator    : Date guichet
#     Gem-Set           : 11 Diamonds - 0.11000 Carat
#   Movement:
#     Movement type     : Automatic
#     Caliber           : R763
#     Power reserve     : 80 hours
#     Accuracy          : Movement tested in 5 position
#     Balance wheel     : Antimagnetic Nivachron™ hairspring
#   Bracelet:
#     Bracelet material : High-Tech Ceramic, Stainless steel / PVD
#     Bracelet color    : Brown
#     Clasp             : 3-fold, Brushed Stainless Steel

spec_accordions:
  # Accordion panel wrapper (one per section, toggled via Alpine.js)
  panel_selector: "[x-ref^='accordion-']:not([x-ref*='button'])"
  # Spec item block (label + value pair)
  item_selector: ".flex.flex-col.gap-2"
  item_label_selector: "h4"
  item_value_selector: "p.font-helvetica.font-light"

  sections:
    - index: 0
      name: "Global features"
    - index: 1
      name: "Case"
    - index: 2
      name: "Dial"
    - index: 3
      name: "Movement"
    - index: 4
      name: "Bracelet"

# ── Spec table (output format) ────────────────────────────────────────────────
