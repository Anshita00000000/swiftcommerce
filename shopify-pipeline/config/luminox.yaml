# ============================================================
# LUMINOX — BRAND CONFIG
# Verified against: Luminox.txt (HTML snapshot provided by user)
# Platform: Shopify (custom Avada-style theme)
# Collection page: https://luminox.com/collections/all-watches
# Product example: https://luminox.com/products/navy-seal-chronograph-45-mm-military-dive-watch
# Total products: ~90 (pagination shows "1-48 of 90 products")
# ============================================================

brand: luminox
display_name: "Luminox"
base_url: https://luminox.com

url_collection:
  type: category_scrape
  category_urls:
    - url: https://luminox.com/collections/mens-watches
      gender: mens
    - url: https://luminox.com/collections/womens-watches
      gender: womens

  pagination:
    # Confirmed: "Load more" button — <a href="/collections/all-watches?page=4" data-click-to-load="">Load more</a>
    # NOT infinite scroll — explicit button click required
    type: load_more
    load_more_selector: "a[data-click-to-load]"

  # Confirmed: <a class="product-item__image-link" href="/products/{handle}">
  product_link_selector: "a.product-item__image-link"
  link_attribute: href

driver:
  type: undetected
  use_webdriver_manager: true
  start_maximized: true
  first_load_wait: 8
  page_load_wait: 4

anti_bot:
  random_delay_min: 2
  random_delay_max: 5
  slow_scroll: true
  scroll_pause: 2.0

# ── Listing page availability ─────────────────────────────────────────────────
# Available: no badge, OR .product-badge without --sold-out modifier
#   e.g. <div class="product-badge product-badge" data-handle="new">New</div>
# Sold out: <div class="product-badge product-badge--sold-out">Sold out</div>
# Add-to-cart button is absent entirely for sold-out cards on listing page.
listing_availability:
  selector: ".product-badge--sold-out"
  present_means: sold_out
  status_text: "Sold out"

# ── Product page availability ─────────────────────────────────────────────────
# Available: <button type="submit" name="add" data-add-to-cart data-lang-available="Add to Bag">
#   <span data-add-to-cart-text="">Add to Bag</span>
# Sold out: button is absent; waitlist div shown instead:
#   <div id="attn-waitlist-trigger"><button ...>Notify me when this is back in stock</button></div>
product_availability:
  selector: "button[name='add'][data-add-to-cart]"
  available_text: "Add to Bag"
  unavailable_text: "Unavailable"
  sold_out_text: "Sold out"

# ── Pre-scrape actions ────────────────────────────────────────────────────────
# Only the Description accordion is open by default (data-open="true").
# All 4 remaining spec accordions are collapsed (data-open="false") and must be
# clicked open before scraping specs. Selector targets only collapsed ones.
pre_scrape_actions:
  - type: click_all
    selector: "button.accordion__label[aria-expanded='false']"
    wait_after: 1.0

selectors:
  # Confirmed: <h1 id="product-title-display">Navy SEAL Chronograph</h1>
  title:
    - "h1#product-title-display"
    - "h1.product__title"

  # Confirmed: <div id="product-subtitle-display">Chronograph Watch, 45 mm</div>
  # Describes case size / complication — complements the title
  subtitle:
    - "div#product-subtitle-display"

  # Confirmed: <span data-price="">$845.00</span>
  price:
    - "span[data-price]"
    - ".product__price span"

  # Confirmed: <div class="product__sku" data-product-sku="">SKU: XS.3587</div>
  # Text always prefixed with "SKU: " — must be stripped
  sku:
    - ".product__sku"
    - "[data-product-sku]"
  sku_prefix_to_strip: "SKU: "

  # Description: first accordion, open by default
  # <div class="accordion__content ..."><p><span class="metafield-multi_line_text_field">...</span></p>
  description:
    - ".accordion__content .metafield-multi_line_text_field"
    - ".accordion__content p"

  color: []
  features: []   # Luminox specs are in accordions, not a bullet list

# ── Spec accordions ───────────────────────────────────────────────────────────
# 5 accordions on product page: Description, Watch Details, Technical Information,
# Case, Crown & Glass, Strap.  (Customer Reviews accordion is hidden/empty — skip.)
#
# Structure: each accordion contains multiple .product__callouts-item blocks.
# Each item = one icon image (SVG, src filename acts as implicit label) + one text value.
# Exception: Sustainability item uses an inline SVG <span> icon (no img src).
#
# Verified icon filename -> human label mapping:
#   model_number      -> Model Number
#   function          -> Function
#   weight            -> Weight
#   origin            -> Origin
#   (inline svg)      -> Sustainability
#   battery_life      -> Battery Life
#   Glow_Icon         -> Luminox Light Technology
#   Bezel_Icon        -> Bezel
#   Case_Material     -> Case Material
#   case_back         -> Case Back
#   case_diameter     -> Case Diameter
#   case_height       -> Case Height
#   water_resistance  -> Water Resistance
#   crown             -> Crown
#   glas_material     -> Glass
#   strap_material    -> Strap Material
#   strap_buckle      -> Buckle
#   lug_width         -> Lug Width
#
# Verified example values (XS.3587 Navy SEAL Chronograph, 45 mm):
#   Watch Details:
#     Model Number      : XS.3587
#     Function          : Chronograph date
#     Weight            : 80 g
#     Origin            : Swiss made
#     Sustainability    : Sustainability: comprehensively CO2 neutral watch and brand, scopes 1,2,3 of the Greenhouse Gas Protocol
#   Technical Information:
#     Battery Life      : 50 months
#     LLT               : Constant glow for up to 25 years in any light condition
#     Bezel             : CARBONOX™ unidirectional rotating bezel
#   Case:
#     Case Material     : CARBONOX™
#     Case Back         : 316L stainless-steel case back screwed-on
#     Case Diameter     : 45mm
#     Case Height       : 15 mm
#     Water Resistance  : 200 meters / 660 feet / 20 ATM
#   Crown & Glass:
#     Crown             : Black IP stainless steel push/pull crown with logo
#     Glass             : Hardened mineral glass
#   Strap:
#     Strap Material    : Black NBR rubber strap with IP black stainless steel signature buckle
#     Buckle            : IP black stainless steel buckle
#     Lug Width         : 24 mm

spec_accordions:
  container_selector: ".accordion__inner"
  heading_selector: "h3.ff-heading"
  item_selector: ".product__callouts-item"
  item_text_selector: ".product__callouts-item-text p"
  item_icon_selector: "img"
  item_icon_attribute: src

  # Keyword match against icon src filename -> human label
  # Matching is substring: e.g. "model_number" matches "PDP_MONIcon_model_number_11042023.svg"
  icon_label_map:
    model_number:      "Model Number"
    function:          "Function"
    weight:            "Weight"
    origin:            "Origin"
    battery_life:      "Battery Life"
    Glow_Icon:         "Luminox Light Technology"
    Bezel_Icon:        "Bezel"
    Case_Material:     "Case Material"
    case_back:         "Case Back"
    case_diameter:     "Case Diameter"
    case_height:       "Case Height"
    water_resistance:  "Water Resistance"
    crown:             "Crown"
    glas_material:     "Glass"
    strap_material:    "Strap Material"
    strap_buckle:      "Buckle"
    lug_width:         "Lug Width"

  # Fallback label for items with no img src (inline SVG icon — e.g. Sustainability):
  # Use "{accordion_heading} - Item {n}"
  inline_icon_fallback: "{accordion_heading} - Item {n}"

  sections:
    - name: "Watch Details"
    - name: "Technical Information"
    - name: "Case"
    - name: "Crown & Glass"
    - name: "Strap"

# ── Spec table (output format for product description block) ─────────────────
spec_table:
  header: "Item Specification"
  rows:
    - label: "Brand"
      type: static
      value: "Luminox"
    - label: "Model Number"
      type: spec_accordion
      spec_key: "Model Number"
    - label: "Function"
      type: spec_accordion
      spec_key: "Function"
    - label: "Weight"
      type: spec_accordion
      spec_key: "Weight"
    - label: "Origin"
      type: spec_accordion
      spec_key: "Origin"
    - label: "Battery Life"
      type: spec_accordion
      spec_key: "Battery Life"
    - label: "Luminox Light Technology"
      type: spec_accordion
      spec_key: "Luminox Light Technology"
    - label: "Bezel"
      type: spec_accordion
      spec_key: "Bezel"
    - label: "Case Material"
      type: spec_accordion
      spec_key: "Case Material"
    - label: "Case Back"
      type: spec_accordion
      spec_key: "Case Back"
    - label: "Case Diameter"
      type: spec_accordion
      spec_key: "Case Diameter"
    - label: "Case Height"
      type: spec_accordion
      spec_key: "Case Height"
    - label: "Water Resistance"
      type: spec_accordion
      spec_key: "Water Resistance"
    - label: "Crown"
      type: spec_accordion
      spec_key: "Crown"
    - label: "Glass"
      type: spec_accordion
      spec_key: "Glass"
    - label: "Strap Material"
      type: spec_accordion
      spec_key: "Strap Material"
    - label: "Buckle"
      type: spec_accordion
      spec_key: "Buckle"
    - label: "Lug Width"
      type: spec_accordion
      spec_key: "Lug Width"

# ── Image extraction ──────────────────────────────────────────────────────────
# Confirmed: lightbox gallery anchors hold full CDN URLs (protocol-relative)
# <a class="lightbox-image no-transition" href="//luminox.com/cdn/shop/files/XS.3587-S90-1080px-_2025.jpg?v=...">
# Must prepend https: — href values start with //
image_extraction:
  method: dom
  dom_selectors:
    - "a.lightbox-image[href*='luminox.com/cdn']"
    - "a.lightbox-image[href*='cdn.shopify']"
  dom_attribute: href
  magento_json: false
  url_cleanup:
    strip_query_params: false
    prepend_scheme: "https:"

image_download:
  use_session_cookies: false
  referer: "https://luminox.com/"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

# ── Shopify export ────────────────────────────────────────────────────────────
# Source: confirmed from end of Luminox.txt
#   Vendor: Luminox
#   Tags: Wristwatches, Watches, Jewelry & Watches, SwiftCommerce_Luminox,
#         + Women's Watches (if women), Men's Watches (if men), both if unisex
#   Product Category: Apparel & Accessories > Jewelry > Watches
shopify:
  vendor: "Luminox"
  product_type: "Watches"
  product_category: "Apparel & Accessories > Jewelry > Watches"
  status_on_import: draft

  default_tags:
    - "Wristwatches"
    - "Watches"
    - "Jewelry & Watches"
    - "SwiftCommerce_Luminox"

  # Added at runtime based on which gender collection URL the product came from
  gender_tags:
    mens: "Men's Watches"
    womens: "Women's Watches"
    unisex:
      - "Men's Watches"
      - "Women's Watches"

  source_url_metafield: "custom.source_url"
